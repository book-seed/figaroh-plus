[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figaroh"
version = "0.4.3"
description = "A Python toolbox for dynamics identification and geometric calibration of robots and humans"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
maintainers = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
keywords = [
    "robotics",
    "dynamics",
    "calibration",
    "identification",
    "urdf",
    "pinocchio",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "scipy",
    "pin",
    "matplotlib",
    "pyyaml",
    "meshcat",
    "pandas",
    "rospkg",
    "picos",
    "numdifftools",
    "ndcurves",
]

[project.urls]
Homepage = "https://github.com/book-seed/figaroh-plus"
Repository = "https://github.com/book-seed/figaroh-plus"
Issues = "https://github.com/book-seed/figaroh-plus/issues"
Examples = "https://github.com/book-seed/figaroh-examples"

# Uncomment if you have CLI tools
# [project.scripts]
# figaroh = "figaroh.cli:main"

# [project.gui-scripts]
# figaroh-gui = "figaroh.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figaroh"]

[tool.hatch.build.targets.wheel.force-include]
# Only include core package, exclude examples and models

[tool.hatch.build.targets.sdist]
exclude = [
    "examples/",
    "models/",
    "docs/build/",
]

# =============================================================================
# Pixi environment configuration
# =============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64", "osx-arm64"]

[tool.pixi.tasks]
shell.cmd = "bash"
test.cmd = "pytest tests/"
lint.cmd = "flake8 src/ && mypy src/"
format.cmd = "black src/ tests/ && isort src/ tests/"
clean.cmd = "rm -rf dist/ build/ *.egg-info"
build.cmd = "python -m build"
docs.cmd = "cd docs && make html"

[tool.pixi.feature.core.dependencies]
python = "3.12.*"
cyipopt = { version = "*", channel = "conda-forge" }

[tool.pixi.feature.core.pypi-dependencies]
figaroh = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=6.0"
pytest-cov = "*"
black = "*"
isort = "*"
flake8 = "*"
mypy = "*"
build = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autodoc-typehints = "*"

[tool.pixi.feature.examples.pypi-dependencies]
jupyter = "*"
notebook = "*"
ipywidgets = "*"
viser = "*"

[tool.pixi.environments]
default = { features = ["core", "dev", "docs"], solve-group = "default" }
docs = { features = ["core", "docs"], solve-group = "default" }
test = { features = ["core", "dev"], solve-group = "default" }
examples = { features = ["core", "examples"], solve-group = "default" }

# =============================================================================
# Pyright / Pylance configuration
# =============================================================================

[tool.pyright]
pythonPath = ".pixi/envs/default/bin/python"
stubPath = "typings"
extraPaths = [
    "figaroh-examples",
    ".pixi/envs/default/lib/python3.12/site-packages",
]
