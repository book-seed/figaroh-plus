[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figaroh"
version = "0.4.3"
description = "A Python toolbox for dynamics identification and geometric calibration of robots and humans"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
maintainers = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
keywords = [
    "robotics",
    "dynamics",
    "calibration",
    "identification",
    "urdf",
    "pinocchio",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "meshcat",
    "pandas",
    "rospkg",
    "picos",
    "numdifftools",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]
examples = [
    "jupyter",
    "notebook",
    "ipywidgets",
]
casadi = [
    "casadi>=3.6.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/figaroh"]

[tool.hatch.build.targets.wheel.force-include]
# Only include core package, exclude examples and models

[tool.hatch.build.targets.sdist]
exclude = [
    "examples/",
    "models/",
    "docs/build/",
]

[project.urls]
Homepage = "https://github.com/thanhndv212/figaroh-plus"
Repository = "https://github.com/thanhndv212/figaroh-plus"
Issues = "https://github.com/thanhndv212/figaroh-plus/issues"
Examples = "https://github.com/thanhndv212/figaroh-examples"

# Uncomment if you have CLI tools
# [project.scripts]
# figaroh = "figaroh.cli:main"

# [project.gui-scripts]
# figaroh-gui = "figaroh.gui:main"

# =============================================================================
# Pixi environment configuration
# =============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64", "osx-arm64"]

[tool.pixi.tasks]
shell.cmd = "bash"
test.cmd = "pytest tests/"
lint.cmd = "flake8 src/ && mypy src/"
format.cmd = "black src/ tests/ && isort src/ tests/"
clean.cmd = "rm -rf dist/ build/ *.egg-info"
build.cmd = "python -m build"
docs.cmd = "cd docs && make html"
# One-command setup: install casadi env + build CasADi from source with OpenMP.
# Idempotent — if already built, skips compilation.
#
# For end users:
#   pixi run install-casadi
#
# Or step-by-step:
#   pixi install -e casadi
#   pixi run -e casadi build-casadi-openmp
install-casadi = "pixi install -e casadi && pixi run -e casadi build-casadi-openmp"
# Self-contained CasADi+OpenMP source build with GitHub→PyPI download fallback.
# Checks for existing OpenMP build first — if already installed, exits immediately.
build-casadi-openmp = { cmd = "python -c \"import casadi; casadi.Function('_',[casadi.SX.sym('x')],[0]).map(2,'openmp'); raise SystemExit(0)\" 2>/dev/null && echo 'CasADi+OpenMP already installed.' && exit 0; V=3.7.2; S=/tmp/casadi-${V}; B=/tmp/casadi-build; echo 'Downloading CasADi ${V}...'; curl -L --retry 3 -o /tmp/casadi.tar.gz https://github.com/casadi/casadi/archive/refs/tags/${V}.tar.gz || { echo 'GitHub failed, trying PyPI...'; python -m pip download --no-binary casadi casadi==${V} -d /tmp/cd; tar xzf /tmp/cd/casadi-${V}.tar.gz -C /tmp/; rm -rf ${S}; mv /tmp/casadi-${V} ${S}; rm -rf /tmp/cd /tmp/casadi.tar.gz; }; if [ ! -d ${S} ]; then tar xzf /tmp/casadi.tar.gz -C /tmp/; rm -rf ${S}; mv /tmp/casadi-${V} ${S}; rm -f /tmp/casadi.tar.gz; fi; echo 'Building CasADi with OpenMP...'; cmake -S ${S} -B ${B} -DWITH_OPENMP=ON -DWITH_IPOPT=ON -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DIPOPT_INCLUDE_DIRS=$CONDA_PREFIX/include/coin-or -DIPOPT_LIBRARIES=$CONDA_PREFIX/lib/libipopt.so && cmake --build ${B} --parallel $(nproc) && cmake --install ${B} && echo 'CasADi+OpenMP build complete.'" }

[tool.pixi.feature.core.dependencies]
python = "3.12.*"
pinocchio = ">=4.0.0,<5"
ndcurves = ">=2.0.0"
cyipopt = { version = "*", channel = "conda-forge" }

[tool.pixi.feature.core.pypi-dependencies]
figaroh = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=6.0"
pytest-cov = "*"
black = "*"
isort = "*"
flake8 = "*"
mypy = "*"
build = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autodoc-typehints = "*"

[tool.pixi.feature.examples.pypi-dependencies]
jupyter = "*"
notebook = "*"
ipywidgets = "*"
viser = "*"

[tool.pixi.feature.casadi.dependencies]
cmake = "*"
make = "*"
# CasADi is NOT a conda dep — built from source with OpenMP via build-casadi-openmp task
# Reason: conda-forge CasADi binaries lack OpenMP on ALL platforms

[tool.pixi.environments]
default = { features = ["core", "dev", "docs"], solve-group = "default" }
docs = { features = ["core", "docs"], solve-group = "default" }
test = { features = ["core", "dev"], solve-group = "default" }
examples = { features = ["core", "examples"], solve-group = "default" }
casadi = { features = ["core", "dev", "casadi"], solve-group = "default" }

[tool.pixi.dependencies]
pinocchio = ">=4.0.0,<5"
pip = ">=26.1.2,<27"
