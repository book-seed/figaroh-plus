[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figaroh"
version = "0.4.3"
description = "A Python toolbox for dynamics identification and geometric calibration of robots and humans"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
maintainers = [
    { name = "Thanh D. V. Nguyen", email = "thanhndv212@gmail.com" },
]
keywords = [
    "robotics",
    "dynamics",
    "calibration",
    "identification",
    "urdf",
    "pinocchio",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "scipy",
    "pin",
    "matplotlib",
    "pyyaml",
    "meshcat",
    "pandas",
    "rospkg",
    "picos",
    "numdifftools",
    "ndcurves",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]
examples = [
    "jupyter",
    "notebook",
    "ipywidgets",
]
casadi = [
    "casadi>=3.6.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/figaroh"]

[tool.hatch.build.targets.wheel.force-include]
# Only include core package, exclude examples and models

[tool.hatch.build.targets.sdist]
exclude = [
    "examples/",
    "models/",
    "docs/build/",
]

[project.urls]
Homepage = "https://github.com/thanhndv212/figaroh-plus"
Repository = "https://github.com/thanhndv212/figaroh-plus"
Issues = "https://github.com/thanhndv212/figaroh-plus/issues"
Examples = "https://github.com/thanhndv212/figaroh-examples"

# Uncomment if you have CLI tools
# [project.scripts]
# figaroh = "figaroh.cli:main"

# [project.gui-scripts]
# figaroh-gui = "figaroh.gui:main"

# =============================================================================
# Pixi environment configuration
# =============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64", "osx-arm64"]

[tool.pixi.tasks]
shell.cmd = "bash"
test.cmd = "pytest tests/"
lint.cmd = "flake8 src/ && mypy src/"
format.cmd = "black src/ tests/ && isort src/ tests/"
clean.cmd = "rm -rf dist/ build/ *.egg-info"
build.cmd = "python -m build"
docs.cmd = "cd docs && make html"

[tool.pixi.feature.core.dependencies]
python = "3.12.*"
cyipopt = { version = "*", channel = "conda-forge" }

[tool.pixi.feature.core.pypi-dependencies]
figaroh = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=6.0"
pytest-cov = "*"
black = "*"
isort = "*"
flake8 = "*"
mypy = "*"
build = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autodoc-typehints = "*"

[tool.pixi.feature.examples.pypi-dependencies]
jupyter = "*"
notebook = "*"
ipywidgets = "*"
viser = "*"

[tool.pixi.feature.casadi.dependencies]
casadi = ">=3.6.7"
pinocchio = ">=4.0.0,<5"

[tool.pixi.environments]
default = { features = ["core", "dev", "docs"], solve-group = "default" }
docs = { features = ["core", "docs"], solve-group = "default" }
test = { features = ["core", "dev"], solve-group = "default" }
examples = { features = ["core", "examples"], solve-group = "default" }
casadi = { features = ["core", "dev", "casadi"], solve-group = "default" }

[tool.pixi.dependencies]
pinocchio = ">=4.0.0,<5"
pip = ">=26.1.2,<27"

[tool.pixi.tasks]
# Build CasADi from source with OpenMP support (conda-forge linux-aarch64
# build lacks OpenMP — this task provides the optimized version).
#
# Usage (two steps):
#   1. pixi run download-casadi-src
#   2. pixi run build-casadi-openmp
build-casadi-openmp = { cmd = "cmake -S /tmp/casadi-src -B /tmp/casadi-build -DWITH_OPENMP=ON -DWITH_IPOPT=ON -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DIPOPT_INCLUDE_DIRS=$CONDA_PREFIX/include/coin-or -DIPOPT_LIBRARIES=$CONDA_PREFIX/lib/libipopt.so && cmake --build /tmp/casadi-build --parallel $(nproc) && cmake --install /tmp/casadi-build", depends_on = ["download-casadi-src"] }

download-casadi-src = "python -m pip download --no-binary casadi casadi==3.7.2 -d /tmp/casadi-dl && tar xzf /tmp/casadi-dl/casadi-3.7.2.tar.gz -C /tmp/ && rm -rf /tmp/casadi-src && mv /tmp/casadi-3.7.2 /tmp/casadi-src"
